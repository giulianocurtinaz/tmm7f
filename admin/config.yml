# Forçando atualização da rota de callback
local_backend: true
backend:
  name: github
  repo: giulianocurtinaz/tmm7f
  branch: main
  base_url: https://netlify-cms-oauth-tau-green.vercel.app
  auth_endpoint: auth
  client_id: Ov23liKt0KtKX4iccBn6

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "oracoes"
    label: "Orações"
    folder: "_oracoes"
    create: true
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "page"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Link", name: "link", widget: "string", required: false, hint: "Apenas se for um link externo ou customizado."}
      - {label: "Imagem de Capa", name: "image", widget: "image", required: false}
      - {label: "Categoria", name: "category", widget: "string", required: false}
      - {label: "Conteúdo", name: "body", widget: "markdown"}

  - name: "pontos"
    label: "Pontos Cantados"
    folder: "_pontos"
    create: true
    media_folder: "/assets/audio"
    public_folder: "/assets/audio"
    slug: "ponto-{{id_ponto}}"
    summary: '{{id_ponto}} - {{title}}'
    search_fields: ["title", "id_ponto", "category", "body"]
    fields:
      - {label: "ID Ponto", name: "id_ponto", widget: "string"}
      - { label: "ORDENAÇÃO", name: "ordenacao", widget: "number", value_type: "float", step: 0.1 }
      - {label: "Categoria", name: "category", widget: "select", options: ["Hinos", "Oxalá", "Iemanjá", "Oxum", "Oxóssi", "Xangô", "Iansã", "Ogum", "Pretos Velhos", "Oriente", "Diversos"]}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Letra", name: "body", widget: "markdown"}
      - {label: "Áudios", name: "audios", widget: "list", fields: [
          {label: "URL do Áudio", name: "url", widget: "file"},
          {label: "Legenda", name: "caption", widget: "string", required: false}
        ]}

  - name: "pages"
    label: "Páginas"
    folder: "_pages"
    create: true
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "page"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Permalink", name: "permalink", widget: "string", required: false}
      - {label: "Conteúdo", name: "body", widget: "markdown"}

  - name: "menu_settings"
    label: "Configurações do Menu"
    delete: false
    editor:
      preview: false
    files:
      - name: "navigation"
        label: "Menu Principal"
        file: "_data/navigation.yml"
        fields:
          - label: "Links do Menu"
            name: "links"
            widget: "list"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}

  - name: "posts"
    label: "Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Imagem de Capa", name: "image", widget: "image", required: false}
      - label: "Galeria de Imagens (Adicione várias fotos)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - {label: "Imagem", name: "image", widget: "image"}
          - {label: "Legenda (Opcional)", name: "caption", widget: "string", required: false}
      - {label: "Conteúdo", name: "body", widget: "markdown"}

  - name: "genealogia"
    label: "Genealogia"
    folder: "_genealogia"
    create: true
    summary: '{{codigo_final}} - {{nome_do_centro}}'
    fields:
      - {label: "Código Pai", name: "codigo_pai", widget: "string"}
      - {label: "Código Final", name: "codigo_final", widget: "string"}
      - {label: "Nome do Centro", name: "nome_do_centro", widget: "string"}
      - {label: "Nome Simplificado", name: "nome_simplificado", widget: "string", required: false, hint: "Apenas as últimas palavras. Ex: 'Caboclo Sete Flechas' em vez do nome completo."}
      - {label: "Terreiro Pai", name: "terreiro_pai", widget: "string", required: false}
      - {label: "Ano de Fundação", name: "ano_fundacao", widget: "number", value_type: "int", required: false}
      - {label: "Encerramento", name: "encerramento", widget: "string", required: false}
      - {label: "País", name: "pais", widget: "string", required: false}
      - {label: "Estado", name: "estado", widget: "string", required: false}
      - {label: "Cidade", name: "cidade", widget: "string", required: false}
      - {label: "Dirigente Material Fundador", name: "dirigente_material_fundador", widget: "string", required: false}
      - {label: "Dirigente Espiritual Fundador", name: "dirigente_espiritual_fundador", widget: "string", required: false}
      - {label: "Sucessores Espirituais", name: "sucessores_espirituais", widget: "text", required: false}
      - {label: "Sucessores Materiais", name: "sucessores_materiais", widget: "text", required: false}
      - {label: "Endereço Original", name: "endereco_original", widget: "string", required: false}
      - {label: "Endereço Atual", name: "endereco_atual", widget: "string", required: false}
      - {label: "Dados de Contato", name: "dados_de_contato", widget: "string", required: false}
      - {label: "Foto de Capa", name: "foto_capa", widget: "image", required: false}
      - {label: "Conteúdo Histórico", name: "body", widget: "markdown", required: false}
