title: "Terreira de Mãe Maria"

baseurl: "/tmm7f"
url: "https://giulianocurtinaz.github.io"

remote_theme: wowthemesnet/mediumish-theme-jekyll
description: ""
search_placeholder: "Pesquisar no site..."

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

paginate: 8
paginate_path: /page:num/

collections:
  pontos:
    output: true
    permalink: /pontos/:path/
  pages:
    output: true
  genealogia:
    output: true
    permalink: /genealogia/:path/

defaults:
  - scope:
      path: ""
      type: "genealogia"
    values:
      layout: "genealogia"